# Refresh both sites and deploy them to GitHub Pages.
# User site: https://albertaadraws.github.io (AAIP draw tracker, domain root).
# Power tracker: https://albertaadraws.github.io/alberta-power/ (built from alberta-power/).
#
# The default Actions token cannot create a Pages site. Before the first deploy
# succeeds, set Settings > Pages > Build and deployment > Source to "GitHub Actions".
# enablement: true is attempted anyway; it only works with a user or app token,
# and this workflow does not use one.

name: Refresh and deploy

on:
  schedule:
    # 14:00 UTC daily (about 7:00 AM MST / 8:00 AM MDT). Both sites refresh on this run.
    - cron: "0 14 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pushes made with GITHUB_TOKEN do not start a new run. [skip ci] is a
    # second guard in case a later change pushes the data commit with a PAT.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            alberta-power/requirements.txt

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt -r alberta-power/requirements.txt

      - name: Refresh AAIP data
        # refresh.py exits 1 on a fetch or parse failure and leaves data/*.json untouched.
        run: python3 scripts/refresh.py || echo "AAIP scrape failed; existing data left untouched. Building anyway."

      - name: Build PR tracker
        env:
          SITE_URL: https://albertaadraws.github.io
          BASE_PATH: ""
        run: python3 scripts/build.py

      - name: Check PR tracker canonical URLs and root asset paths
        run: python3 scripts/check_site.py

      - name: Refresh Alberta power and gas rates
        # A source that fails keeps its last good rows. refresh.py exits 1 only if every plan source failed,
        # and then it leaves the JSON files untouched.
        run: python3 alberta-power/scripts/refresh.py || echo "Power rate refresh failed; existing data left untouched. Building anyway."

      - name: Build power tracker
        env:
          SITE_URL: https://albertaadraws.github.io
          BASE_PATH: /alberta-power
        run: python3 alberta-power/scripts/build.py

      - name: Check power tracker subpath links, canonicals, and partner links
        env:
          SITE_URL: https://albertaadraws.github.io
          BASE_PATH: /alberta-power
        run: python3 alberta-power/scripts/check_site.py

      - name: Copy power tracker into the Pages site
        run: |
          set -euo pipefail
          rm -rf public/alberta-power
          mkdir -p public/alberta-power
          cp -a alberta-power/public/. public/alberta-power/

      - name: Draft power newsletter (Mondays, Edmonton time)
        run: |
          if [ "$(TZ=America/Edmonton date +%u)" = "1" ]; then
            SITE_URL=https://albertaadraws.github.io BASE_PATH=/alberta-power python3 alberta-power/scripts/newsletter.py
          fi

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/draws.json data/pools.json data/occupations.json \
            alberta-power/data/plans.json alberta-power/data/defaults.json \
            alberta-power/data/changes.json alberta-power/data/status.json \
            alberta-power/data/history.json \
            alberta-power/newsletter
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh AAIP draws and Alberta power rates [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
