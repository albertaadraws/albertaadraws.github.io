# Refresh AAIP data and deploy the static site to GitHub Pages.
# Site: https://albertaadraws.github.io (user site, served from the domain root).
#
# The default Actions token cannot create a Pages site. Before the first deploy
# succeeds, set Settings > Pages > Build and deployment > Source to "GitHub Actions".
# enablement: true is attempted anyway; it only works with a user or app token,
# and this workflow does not use one.

name: Refresh and deploy

on:
  schedule:
    # 14:00 UTC daily (about 7:00 AM MST / 8:00 AM MDT).
    - cron: "0 14 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pushes made with GITHUB_TOKEN do not start a new run. [skip ci] is a
    # second guard in case a later change pushes the data commit with a PAT.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Refresh AAIP data
        # refresh.py exits 1 on a fetch or parse failure and leaves data/*.json untouched.
        run: python3 scripts/refresh.py || echo "Scrape failed; existing data left untouched. Building anyway."

      - name: Build site
        env:
          SITE_URL: https://albertaadraws.github.io
          BASE_PATH: ""
        run: python3 scripts/build.py

      - name: Check canonical URLs and root asset paths
        run: python3 scripts/check_site.py

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json data/pools.json data/occupations.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh AAIP draw data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
